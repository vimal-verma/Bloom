services:
  - type: web
    name: bloom-pregnancy-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: OLLAMA_HOST
        sync: false
      - key: GEMINI_API_KEY
        sync: false
